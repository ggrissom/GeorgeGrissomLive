name: Import prepared jukebox audio once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-audio-once.yml

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify prepared tracks
        env:
          ONE_QUESTION_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-86c4-81fd-b428-4c02fc2d214b/raw?se=2026-08-01T21:29:27Z&sp=r&sv=2026-02-06&sr=b&scid=fc0569f0-d485-515e-92f8-c2b024651180&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:13:27Z&ske=2026-08-02T01:13:27Z&sks=b&skv=2026-02-06&sig=w8biPZc9vWw7icojAPlXUSvLxqK6E4SFqiN1oqPHva0%3D"
          WHAT_A_SHAME_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-e5d8-81fd-aa3f-f504f4f80256/raw?se=2026-08-01T21:28:59Z&sp=r&sv=2026-02-06&sr=b&scid=d29f7808-1fd3-5f89-86f2-bbf6b99b4876&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T13:11:54Z&ske=2026-08-02T13:11:54Z&sks=b&skv=2026-02-06&sig=MwxyR7dmbZVWtri%2BOj4OUsDIFJ5a1i6GQStdIf2kN8A%3D"
        run: |
          set -euo pipefail
          mkdir -p public/audio
          curl --fail --location --retry 3 --retry-all-errors "$ONE_QUESTION_URL" -o public/audio/one-question.mp3
          curl --fail --location --retry 3 --retry-all-errors "$WHAT_A_SHAME_URL" -o public/audio/what-a-shame-vocals.mp3
          echo "c91063a62947bc84bff1e0a6ab1f48e6a5ffbc37d677bd507934ae814b8abb7c  public/audio/one-question.mp3" | sha256sum --check --strict
          echo "a1d67ebb678b59c94310226daf2b61fbe471b01764f287f2e02099b36303740e  public/audio/what-a-shame-vocals.mp3" | sha256sum --check --strict

      - name: Write audio catalog metadata
        run: |
          cat > public/audio/catalog.json <<'JSON'
          [
            {
              "title": "One Question",
              "artist": "George Grissom",
              "album": "SINGLE",
              "durationSeconds": 191.832,
              "audioUrl": "/audio/one-question.mp3"
            },
            {
              "title": "What a Shame",
              "artist": "George Grissom",
              "album": "SINGLE",
              "durationSeconds": 225.072,
              "audioUrl": "/audio/what-a-shame-vocals.mp3"
            }
          ]
          JSON

      - name: Commit audio and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-audio-once.yml
          git add public/audio
          git commit -m "Add initial jukebox audio tracks"
          git push origin HEAD:main
