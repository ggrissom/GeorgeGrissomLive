name: Probe WAV source for Blob migration

on:
  push:
    branches: [feat/digital-wav-sales]
    paths:
      - ".github/workflows/probe-drive-wav.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check direct Drive download without exposing content
        shell: bash
        run: |
          set -euo pipefail
          url="https://drive.usercontent.google.com/download?id=1SstUXGr0C78uiavltys6X-c6HdaAHjIi&export=download&confirm=t"
          code=$(curl -L -sS -o /tmp/probe -w "%{http_code}" "$url")
          bytes=$(wc -c < /tmp/probe)
          kind=$(file -b /tmp/probe)
          echo "HTTP=$code"
          echo "BYTES=$bytes"
          echo "TYPE=$kind"
          test "$code" = "200"
          test "$bytes" -gt 10000000
          file /tmp/probe | grep -qi "wave audio"
