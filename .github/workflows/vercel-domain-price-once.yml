name: Vercel domain price (one-time)

on:
  push:
    branches:
      - ops/vercel-domain-assignment

permissions:
  contents: read

jobs:
  price:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_ANc1kIyqoKsaghBNgpGhMa7D
    steps:
      - name: Query exact georgegrissom.com pricing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN secret missing"; exit 2; }
          curl -sS \
            "https://api.vercel.com/v1/registrar/domains/georgegrissom.com/price?years=1&teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            | jq -c '{years,purchasePrice,renewalPrice,transferPrice}'
