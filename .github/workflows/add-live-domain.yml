name: Add live.georgegrissom.com to Vercel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-live-domain.yml
  workflow_dispatch:

jobs:
  add-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Add live subdomain to Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          vercel domains add live.georgegrissom.com george-grissom-live \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"
