name: Digital sales infrastructure audit

on:
  push:
    branches: [feat/digital-wav-sales]
    paths:
      - ".github/workflows/digital-sales-infra-audit.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TEAM_ID: team_ANc1kIyqoKsaghBNgpGhMa7D
      PROJECT_ID: prj_3kCNNEP697PhzwkDybYgsc2v4G72
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify production environment names
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN missing"; exit 2; }
          data=$(curl -fsS "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}"             -H "Authorization: Bearer ${VERCEL_TOKEN}")
          echo "Production digital-sales environment:"
          for key in DATABASE_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET BLOB_READ_WRITE_TOKEN GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY NEXT_PUBLIC_SITE_URL; do
            rows=$(printf '%s' "$data" | jq -c --arg key "$key" '[.envs[] | select(.key==$key) | {key,target,type}]')
            count=$(printf '%s' "$rows" | jq 'length')
            if [ "$count" -gt 0 ]; then
              echo "$rows"
            else
              echo "[{\"key\":\"$key\",\"status\":\"MISSING\"}]"
            fi
          done

          for key in DATABASE_URL STRIPE_SECRET_KEY; do
            printf '%s' "$data" | jq -e --arg key "$key" '.envs[] | select(.key==$key and (.target | index("production")))' >/dev/null               || { echo "Required production variable missing: $key"; exit 3; }
          done
