          U05: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-ad4c-81fd-beb1-7a07cd4ffd48/raw?se=2026-09-03T15%3A11%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=5be985bf-fdc1-5fbb-8d9c-5f3c9732f9ac&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T12%3A37%3A45Z&ske=2026-09-04T12%3A37%3A45Z&sks=b&skv=2026-02-06&sig=jXi794OLUf4peAd4S98zngpduWBnXZhdEXWXl%2BIRv4E%3D"
