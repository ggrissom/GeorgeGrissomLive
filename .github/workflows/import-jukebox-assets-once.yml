name: Import protected jukebox assets once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-jukebox-assets-once.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download asset chunks
