          U10: "https://sdmntprwestus.oaiusercontent.com/files/00000000-3b58-8230-a470-dd7b175322f2/raw?se=2026-09-03T15%3A15%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=9ee514af-d8b4-570c-bb36-9d7e1ea1b8e1&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A23%3A34Z&ske=2026-09-03T22%3A23%3A34Z&sks=b&skv=2026-02-06&sig=aG7MZikTMYH7DLmt8%2BmGVyadJuUde/xLb3%2BLvQOzOEo%3D"
          U11: "https://sdmntprwestus.oaiusercontent.com/files/00000000-94a4-8230-b428-65c07c9323cb/raw?se=2026-09-03T15%3A15%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=3475b69a-203f-5b28-b161-3de4be8241b8&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A25%3A59Z&ske=2026-09-03T22%3A25%3A59Z&sks=b&skv=2026-02-06&sig=PltJN397fBe/IhL6dsgQdO9ucrSRhuG08aLJuTzPnd8%3D"
          U12: "https://sdmntprwestus.oaiusercontent.com/files/00000000-1284-8230-b776-9c241ad0bc74/raw?se=2026-09-03T15%3A16%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=3fde3a6e-d141-5b1c-adc1-995dc6893a67&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A32%3A57Z&ske=2026-09-03T22%3A32%3A57Z&sks=b&skv=2026-02-06&sig=EJob9ZVs0hIXDdjFYkZgtVCkqBg5NLWqsW3h/EYto34%3D"
        run: |
          set -euo pipefail
          mkdir -p /tmp/jukebox-parts
          for i in $(seq -w 0 12); do
            var="U${i}"
            url="${!var}"
            curl --fail --location --retry 3 --retry-all-errors "$url" -o "/tmp/jukebox-parts/chunk_${i}"
          done
          cat /tmp/jukebox-parts/chunk_* > /tmp/jukebox-assets.zip
          unzip -t /tmp/jukebox-assets.zip
          unzip -o /tmp/jukebox-assets.zip -d .

      - name: Remove old public full-track loopholes
        run: |
          git rm -f public/audio/one-question.mp3 public/audio/what-a-shame-vocals.mp3 public/audio/catalog.json 2>/dev/null || true

      - name: Commit final asset layout and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-jukebox-assets-once.yml
          git add private/audio public/audio/previews
          test "$(find private/audio -type f -name '*.mp3' | wc -l)" -eq 12
          test "$(find public/audio/previews -type f -name '*-preview.mp3' | wc -l)" -eq 12
          git commit -m "Add protected jukebox masters and 30-second previews"
          git push origin HEAD:main
