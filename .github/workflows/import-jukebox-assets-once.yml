          U08: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-c018-81f7-9b1a-ce5827fde072/raw?se=2026-09-03T15%3A15%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=ae0b8487-c54e-52c2-a629-0305716f4742&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A18%3A45Z&ske=2026-09-03T22%3A18%3A45Z&sks=b&skv=2026-02-06&sig=QKcZJvgiMCEL11Dw0ubPY2duEoSpobusI4UzzPnFsQ8%3D"
