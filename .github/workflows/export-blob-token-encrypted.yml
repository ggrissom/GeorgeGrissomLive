name: Export Blob token encrypted

on:
  push:
    branches: [feat/digital-wav-sales]
    paths:
      - ".github/workflows/export-blob-token-encrypted.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TEAM_ID: team_ANc1kIyqoKsaghBNgpGhMa7D
      PROJECT_ID: prj_3kCNNEP697PhzwkDybYgsc2v4G72
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Return only RSA-encrypted Blob token
        shell: bash
        run: |
          set -euo pipefail
          data=$(curl -fsS "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}&decrypt=true" -H "Authorization: Bearer ${VERCEL_TOKEN}")
          value=$(printf '%s' "$data" | jq -r '.envs[] | select(.key=="BLOB_READ_WRITE_TOKEN") | .value' | head -n1)
          test -n "$value" && test "$value" != "null"
          echo '' | base64 -d > public.pem
          printf '%s' "$value" > secret.txt
          cipher=$(openssl pkeyutl -encrypt -pubin -inkey public.pem -in secret.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)
          rm -f secret.txt
          echo "BLOB_TOKEN_CIPHERTEXT=$cipher"
