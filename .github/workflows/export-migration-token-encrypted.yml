name: Export migration token encrypted

on:
  push:
    branches: [feat/digital-wav-sales]
    paths:
      - ".github/workflows/export-migration-token-encrypted.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TEAM_ID: team_ANc1kIyqoKsaghBNgpGhMa7D
      PROJECT_ID: prj_3kCNNEP697PhzwkDybYgsc2v4G72
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ENV_KEY: AUDIO_MIGRATION_TOKEN_20260927
    steps:
      - name: Return only RSA-encrypted token
        shell: bash
        run: |
          set -euo pipefail
          data=$(curl -fsS "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}&decrypt=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          value=$(printf '%s' "$data" | jq -r --arg key "$ENV_KEY" '.envs[] | select(.key==$key) | .value' | head -n1)
          test -n "$value" && test "$value" != "null"
          echo '' | base64 -d > public.pem
          cipher=$(printf '%s' "$value" | openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)
          echo "MIGRATION_TOKEN_CIPHERTEXT=$cipher"
