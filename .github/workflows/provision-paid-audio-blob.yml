name: Provision private paid-audio Blob store

on:
  push:
    branches: [feat/digital-wav-sales]
    paths:
      - ".github/workflows/provision-paid-audio-blob.yml"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      TEAM_ID: team_ANc1kIyqoKsaghBNgpGhMa7D
      PROJECT_ID: prj_3kCNNEP697PhzwkDybYgsc2v4G72
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Create private Blob store for paid masters
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN missing"; exit 2; }

          body='{"name":"george-grissom-paid-audio","region":"iad1","access":"private","projectId":"'${PROJECT_ID}'"}'
          response=$(mktemp)
          code=$(curl -sS -o "$response" -w "%{http_code}" \
            -X POST "https://api.vercel.com/storage/stores/blob?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$body")

          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            echo "Private Blob store created and connected."
            jq '{id: (.store.id // .id), name: (.store.name // .name), access: (.store.access // .access), region: (.store.region // .region), status: (.store.status // .status)}' "$response"
          elif [ "$code" = "409" ]; then
            echo "A store with this name/project already exists; leaving it in place."
          else
            echo "Blob store provisioning failed with HTTP $code"
            jq '{error: (.error.code // .error.message // .message // "unknown")}' "$response" || true
            exit 3
          fi
