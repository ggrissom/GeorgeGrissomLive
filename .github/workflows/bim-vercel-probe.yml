name: Probe BIM Vercel ownership

on:
  push:
    branches:
      - ops/bim-vercel-cutover

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TEAM_ID: team_ANc1kIyqoKsaghBNgpGhMa7D
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret missing"; exit 1; }

      - name: List projects and project domains safely
        shell: bash
        run: |
          set -euo pipefail
          projects=$(curl -fsS --oauth2-bearer "$VERCEL_TOKEN" "https://api.vercel.com/v9/projects?teamId=${TEAM_ID}&limit=100")
          printf '%s' "$projects" > /tmp/projects.json
          node -e 'const p=require("/tmp/projects.json"); for(const x of p.projects||[]){console.log(JSON.stringify({id:x.id,name:x.name,framework:x.framework||null,repo:x.link?.repo||x.link?.repoId||null,repoType:x.link?.type||null,rootDirectory:x.rootDirectory||null}))}'
          ids=$(node -e 'const p=require("/tmp/projects.json"); process.stdout.write((p.projects||[]).map(x=>x.id).join(" "))')
          for id in $ids; do
            body=$(curl -fsS --oauth2-bearer "$VERCEL_TOKEN" "https://api.vercel.com/v9/projects/${id}/domains?teamId=${TEAM_ID}&limit=100")
            printf '%s' "$body" > /tmp/domains.json
            PROJECT_ID="$id" node -e 'const b=require("/tmp/domains.json"); const d=(b.domains||[]).map(x=>({name:x.name,verified:x.verified,gitBranch:x.gitBranch||null})); if(d.length) console.log(JSON.stringify({projectId:process.env.PROJECT_ID,domains:d}))'
          done
