name: Prepare standalone BIM Vercel project

on:
  push:
    branches:
      - ops/bim-vercel-cutover

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      TEAM_ID: team_ANc1kIyqoKsaghBNgpGhMa7D
      PROJECT_ID: prj_96bezO8lqJ1aRz9zkEAdjWekXhDf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret missing"; exit 1; }

      - name: Set Next.js project configuration
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -X PATCH \
            --oauth2-bearer "$VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"framework":"nextjs","buildCommand":"npm run build","installCommand":"npm install"}' \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}?teamId=${TEAM_ID}")
          printf '%s' "$response" > /tmp/project.json
          node -e 'const p=require("/tmp/project.json"); console.log(JSON.stringify({id:p.id,name:p.name,framework:p.framework,buildCommand:p.buildCommand,installCommand:p.installCommand,repo:p.link?.repo||null}))'

      - name: Verify BIM domain remains assigned and verified
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --oauth2-bearer "$VERCEL_TOKEN" "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains?teamId=${TEAM_ID}&limit=100")
          printf '%s' "$body" > /tmp/domains.json
          node -e 'const b=require("/tmp/domains.json"); const d=(b.domains||[]).find(x=>x.name==="bim.georgegrissom.com"); if(!d||!d.verified){console.error("bim.georgegrissom.com is not verified on target project");process.exit(1)}; console.log(JSON.stringify({name:d.name,verified:d.verified,gitBranch:d.gitBranch||null}))'
